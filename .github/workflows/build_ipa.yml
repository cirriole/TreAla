name: Build iOS IPA for Sideloadly
on:
  workflow_dispatch: # 手動実行ボタンを有効化

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.3.0'

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: "npm"

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm install

      - name: Prebuild (Convert to Native Project)
        run: npx expo prebuild --platform ios --no-install

      # 【重要】Pod キャッシュをクリア
      - name: Clean Pods Cache
        run: |
          cd ios
          rm -rf Pods
          rm -rf Podfile.lock
          cd ..

      # 【重要】Xcode キャッシュをクリア
      - name: Clean Xcode Derived Data
        run: rm -rf ~/Library/Developer/Xcode/DerivedData/*

      - name: Fix Deployment Target
        run: |
          find . -name "Podfile" -exec sed -i '' 's/platform :ios, .*/platform :ios, '\''26.0'\''/g' {} +

      - name: Install iOS Pods
        run: |
          cd ios
          pod install

      - name: Build Unsigned IPA with Xcode
        run: |
          PROJECT_NAME=$(ls ios | grep .xcworkspace | sed 's/\.xcworkspace//')
          echo "Found project: $PROJECT_NAME"

          xcodebuild -workspace "./ios/$PROJECT_NAME.xcworkspace" \
            -scheme "$PROJECT_NAME" \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "./build/$PROJECT_NAME.xcarchive" \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            SKIP_INSTALL=NO \
            BUILD_LIBRARIES_FOR_DISTRIBUTION=YES \
            -allowProvisioningUpdates

          mkdir Payload
          cp -r "./build/$PROJECT_NAME.xcarchive/Products/Applications/$PROJECT_NAME.app" ./Payload/
          zip -r DIRECTORY_NAME.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: DIRECTORY_NAME-IPA
          path: DIRECTORY_NAME.ipa
